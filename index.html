<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escritos</title>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
    }

    /* Icono de la Carpeta estilo Oklama */
    .folder-wrapper {
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .folder-wrapper:hover {
      transform: scale(1.05);
    }

    .folder-icon {
      width: 70px;
      height: 50px;
      background-color: #1e6b36; /* Verde Oklama */
      border-radius: 2px 6px 2px 2px;
      position: relative;
      margin: 0 auto 12px auto;
    }

    .folder-icon::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 0;
      width: 25px;
      height: 8px;
      background-color: #1e6b36;
      border-radius: 3px 3px 0 0;
    }

    .folder-label {
      color: #888888;
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* Ventana del Escrito */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      z-index: 100;
    }

    .modal-content {
      background: #080808;
      border: 1px solid #222222;
      padding: 35px;
      max-width: 650px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.8;
      color: #dddddd;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .close-btn {
      color: #555555;
      cursor: pointer;
      float: right;
      font-weight: bold;
      font-size: 12px;
    }

    .close-btn:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- CARPETA -->
  <div class="folder-wrapper" onclick="openText()">
    <div class="folder-icon"></div>
    <div class="folder-label">master.txt</div>
  </div>

  <!-- TEXTO OCULTO -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeText()">[ CERRAR ]</span>
      
      <!-- TU ESCRITO EMPIEZA AQUÍ -->
12 de Septiembre.

Escribe aquí todo tu texto. Puedes poner saltos de línea,
poemas, declaraciones o reflexiones.

Todo lo que escribas aquí dentro se verá exactamente igual
cuando la gente haga clic en la carpeta.
      <!-- TU ESCRITO TERMINA AQUÍ -->

    </div>
  </div>

  <script>
    function openText() {
      document.getElementById('modal').style.display = 'flex';
    }
    function closeText() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>

  <!-- CONTADOR INVISIBLE (GoatCounter) -->
  <script data-goatcounter="https://TUSUBDOMINIO.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

</body>
</html>
